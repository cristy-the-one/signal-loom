# Unsigned Signal Loom installers.
#
# The `checks` job runs the CI workflow first. Each matrix job then builds one
# platform's installer and uploads it as a workflow artifact, so nothing is
# built from a commit that fails CI. A push of a `v*` tag then runs
# `draft-release`, which checks that the tag matches the versions in
# tauri.conf.json, package.json and the root Cargo.toml, and attaches every
# installer to one draft release named after the tag. A manual run
# (workflow_dispatch) only builds the artifacts.

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  installers:
    name: ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-nsis
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifacts: |
              **/bundle/nsis/*-setup.exe
          - name: linux-deb-appimage
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifacts: |
              **/bundle/deb/*.deb
              **/bundle/appimage/*.AppImage
          - name: macos-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifacts: |
              **/bundle/dmg/*.dmg
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            artifacts: |
              **/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Linux webview and AppImage dependencies
        if: matrix.name == 'linux-deb-appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned stable toolchain and this job's Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build the unsigned installer
        env:
          NO_STRIP: ${{ matrix.name == 'linux-deb-appimage' && 'true' || '' }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error


  draft-release:
    name: draft-release
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app versions
        shell: bash
        run: |
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          workspace_version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p}' Cargo.toml | head -n 1)"
          status=0
          for pair in "src-tauri/tauri.conf.json=${tauri_version}" "package.json=${package_version}" "Cargo.toml [workspace.package]=${workspace_version}"; do
            file="${pair%%=*}"
            version="${pair#*=}"
            if [ -z "${version}" ] || [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version:-<missing>} in ${file}"
              status=1
            fi
          done
          exit "${status}"

      - uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Attach every installer to one draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: Signal Loom ${{ github.ref_name }}
          body: |
            Unsigned Signal Loom ${{ github.ref_name }} installers: Windows (NSIS), Linux (deb, AppImage) and macOS (dmg, Apple silicon and Intel).
            They carry no Authenticode or Apple Developer ID signature, so Windows SmartScreen and macOS Gatekeeper will warn before the first run.
          files: installers/**/*
          fail_on_unmatched_files: true
