name: ci

on:
  push:
  pull_request:
  workflow_call:

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - run: rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: Generate the synthetic hypercar lap
        run: python3 scripts/gen_fixture.py
      - run: cargo test -p loom-core -p loom-serve -p loom-judge
      - run: cargo clippy -p loom-core -p loom-serve -p loom-judge --all-targets -- -D warnings
      - name: Judge the contract fixture
        run: |
          cargo run -p loom-judge --release -- --log fixtures/judge/brake.asc --dbc fixtures/judge/brake.dbc --request fixtures/judge/request.json --out "$RUNNER_TEMP/verdict.json"
          cmp "$RUNNER_TEMP/verdict.json" fixtures/judge/expected-verdict.json

  tauri-smoke:
    name: tauri-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: cargo check -p signal-loom
      - run: cargo clippy -p signal-loom --all-targets -- -D warnings
