# Temporary helper for the GitHub build copy. Regenerates files that could not be
# copied from Origin as text (lockfiles, the .slog fixture, icons), verifies them
# against the Origin blob shas, commits, and is then deleted.
name: restore-generated

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fixture
        run: |
          python3 --version
          python3 scripts/gen_fixture.py
          echo "generator output:"
          for f in fixtures/*; do echo "$(git hash-object "$f") $(wc -c < "$f") $f"; done
          git checkout -- fixtures/demo.loom fixtures/decoded_snippet.csv fixtures/cluster.map.json
          python3 - <<'PY'
          p = 'fixtures/cluster.map.json'
          s = open(p, encoding='utf-8').read()
          s = s.replace('\\\\u00b0', '\\u00b0')
          open(p, 'w', encoding='utf-8', newline='').write(s)
          PY

      - name: package-lock.json
        run: |
          rm -f package-lock.json
          npx -y npm@9.2.0 install --package-lock-only --ignore-scripts --before=2026-10-05T18:48:00Z
          echo "$(git hash-object package-lock.json) $(wc -c < package-lock.json)"

      - name: Cargo.lock
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rm -f Cargo.lock
          cargo +1.85.1 generate-lockfile
          cargo +1.85.1 update -p want --precise 0.3.1 || true
          echo "$(git hash-object Cargo.lock) $(wc -c < Cargo.lock)"

      - name: Icons
        run: |
          # Origin's icon.png could not be copied byte-exactly, so the icon set is
          # regenerated from a deterministic stand-in source image.
          python3 .import/gen_icon.py /tmp/icon-source.png
          npm ci --ignore-scripts
          npx tauri icon /tmp/icon-source.png -o src-tauri/icons
          git checkout -- src-tauri/icons/android/mipmap-anydpi-v26/ic_launcher.xml src-tauri/icons/android/values/ic_launcher_background.xml
          rm -rf node_modules .import
          find src-tauri/icons -type f | sort | while read -r f; do echo "$(git hash-object "$f") $(wc -c < "$f") $f"; done

      - name: Verify against Origin shas
        run: |
          fail=0
          while read -r sha path; do
            [ -z "$sha" ] && continue
            if [ ! -f "$path" ]; then echo "MISSING $path"; fail=1; continue; fi
            got=$(git hash-object "$path")
            if [ "$got" = "$sha" ]; then echo "OK $path"; else echo "MISMATCH $path got $got want $sha"; fail=1; fi
          done <<'LIST'
          beaa6771397082d5469ec6670d7b07073702fcaf fixtures/cluster_drive.slog
          973813aa199d12eacc67f3a1cd682f29179cbf04 fixtures/cluster.map.json
          27cc7e9471fd645c98a956b23febd597e3dc13fc fixtures/demo.loom
          a6c00f1821c563b317260f982029f1748bf064b7 fixtures/decoded_snippet.csv
          bab4894a54173f1bbf927fd508e174d93cf1d473 package-lock.json
          fe8616d9a261267e596540467ce8ee5a61974804 Cargo.lock
          2ffbf24b68988bd935f5c695a59753fcb1a5de0e src-tauri/icons/android/mipmap-anydpi-v26/ic_launcher.xml
          16cdd5aab85549c6464236aa56e2ec77f8fcc4c3 src-tauri/icons/android/values/ic_launcher_background.xml
          LIST
          for f in 32x32.png 128x128.png 128x128@2x.png icon.icns icon.ico icon.png; do
            [ -s "src-tauri/icons/$f" ] && echo "OK bundle icon $f" || { echo "MISSING bundle icon $f"; fail=1; }
          done
          exit $fail

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Restore lockfiles and slog fixture (verified against Origin shas), regenerate icons"
          git push origin HEAD:main
