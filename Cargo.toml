[workspace]
resolver = "2"
members = ["src-tauri", "crates/loom-core", "crates/loom-serve"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Signal Loom"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Tauri looks at the workspace profile when the app crate is a member.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
